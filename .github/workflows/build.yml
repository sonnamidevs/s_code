name: Build PyIDE APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ==================== KEYSTORE SETUP ====================
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          echo "Keystore size:"
          wc -c android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
          echo "key.properties created:"
          cat android/key.properties
      # ========================================================

      # ==================== FIREBASE SETUP ====================
      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
          
          echo "File size:"
          wc -c android/app/google-services.json
          
          echo "First 200 chars:"
          head -c 200 android/app/google-services.json
          echo ""
          echo ""
          
          if ! python3 -c "import json; json.load(open('android/app/google-services.json'))" 2>/dev/null; then
            echo "ERROR: google-services.json is NOT valid JSON!"
            echo "Full contents:"
            cat android/app/google-services.json
            exit 1
          fi
          
          echo "✓ google-services.json is valid JSON"
      # ========================================================

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PyIDE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PyIDE
          path: build/app/outputs/flutter-apk/PyIDE.apk
