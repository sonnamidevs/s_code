workflows:
  android-release:
    name: PyIDE Android Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
      vars:
        KEYSTORE_BASE64: ""
        KEYSTORE_PASSWORD: "Sonnami"
        KEY_ALIAS: "scode"
        KEY_PASSWORD: "Sonnami"
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Decode Keystore
        script: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        script: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Verify keystore
        script: |
          ls -lh android/app/upload-keystore.jks
          cat android/key.properties

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

      - name: Rename APK
        script: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/PyIDE.apk

    artifacts:
      - build/app/outputs/flutter-apk/PyIDE.apk

    publishing:
      email:
        recipients:
          - sonnamidev@gmail.com
        notify:
          success: true
          failure: true
